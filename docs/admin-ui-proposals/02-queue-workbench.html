<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>B. 큐 작업대 — E샵 관리자</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
      :root {
        --rail: #1c1917;
        --rail-text: #e7e5e4;
        --rail-mute: #a8a29e;
        --ink: #1c1917;
        --mute: #57534e;
        --line: #e7e0d6;
        --bg: #f4f1ec;
        --paper: #fffcf8;
        --action: #9a3412;
        --wait: #c2410c;
        --ok: #3f6212;
        --top: 44px;
        --bar: 40px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: Pretendard, "Noto Sans KR", sans-serif;
        background: var(--bg);
        color: var(--ink);
        font-size: 14px;
        line-height: 1.4;
      }
      ::selection { background: #f6d3c0; }
      :focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
      .skip {
        position: absolute; left: 8px; top: -48px; z-index: 80;
        background: #fff; color: var(--ink); padding: 8px 12px; font-weight: 650;
      }
      .skip:focus { top: 8px; }
      button, input, select { font: inherit; color: inherit; }
      a { color: inherit; text-decoration: none; }
      .icon { width: 18px; height: 18px; flex: none; display: block; }

      .app {
        display: grid;
        grid-template-rows: var(--top) 1fr var(--bar);
        min-height: 100%;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 8px 0 16px;
        background: var(--rail);
        color: var(--rail-text);
      }
      .brand { font-weight: 700; letter-spacing: -0.03em; margin-right: 16px; }
      .top a, .top button.nav {
        height: 28px;
        padding: 0 10px;
        display: grid;
        place-items: center;
        border: 0;
        background: transparent;
        color: var(--rail-mute);
        cursor: pointer;
      }
      .top a[aria-current="page"] {
        color: #fff;
        background: #292524;
      }
      .who { margin-left: auto; display: flex; gap: 12px; align-items: center; font-size: 13px; color: var(--rail-mute); }
      .who button { background: none; border: 0; color: var(--rail-text); cursor: pointer; }

      .body { display: grid; grid-template-columns: 240px 1fr; min-height: 0; }
      .queues {
        background: var(--rail);
        color: var(--rail-text);
        padding: 12px 8px 24px;
        overflow: auto;
      }
      .queues h2 {
        margin: 0 10px 8px;
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--rail-mute);
        font-weight: 650;
      }
      .q {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        cursor: pointer;
        border-radius: 2px;
      }
      .q:hover { background: #292524; }
      .q[aria-current="true"] { background: #44403c; color: #fff; }
      .q .n {
        margin-left: auto;
        min-width: 24px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
      }
      .q.hot .n { color: #fdba74; }

      .work { min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
      .work-head {
        display: flex;
        align-items: flex-end;
        flex-wrap: wrap;
        gap: 12px;
        padding: 20px 20px 12px;
      }
      .work-head h1 { margin: 0; font-size: 22px; letter-spacing: -0.03em; }
      .work-head p { margin: 0 0 4px; color: var(--mute); font-size: 13px; }
      .work-head .spacer { flex: 1; }
      .field, .btn, select.field {
        height: 32px;
        border: 1px solid #d6cfc4;
        background: var(--paper);
        padding: 0 10px;
      }
      .btn { cursor: pointer; }
      .btn:disabled { color: #a8a29e; cursor: not-allowed; }
      .btn-primary {
        background: var(--action);
        border-color: var(--action);
        color: #fff;
        font-weight: 650;
      }
      .btn-primary:disabled { background: #d6b8a8; border-color: #d6b8a8; color: #fff; }

      .list { padding: 0 16px 24px; overflow: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; }
      .ticket {
        display: grid;
        grid-template-columns: 28px 1fr auto;
        gap: 12px;
        align-items: center;
        background: var(--paper);
        border: 1px solid var(--line);
        padding: 12px 14px;
      }
      .ticket[aria-selected="true"] { border-color: var(--action); background: #fff7f2; }
      .ticket .id { font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
      .ticket .meta { color: var(--mute); font-size: 13px; }
      .ticket .price { font-variant-numeric: tabular-nums; font-weight: 650; text-align: right; }
      .st { font-size: 12px; font-weight: 700; }
      .st-WAIT { color: var(--wait); }
      .st-PAYMENT { color: #9a3412; }
      .st-COMPLETE { color: var(--ok); }
      .st-CANCEL { color: #9f1239; }
      .empty { padding: 48px; text-align: center; color: var(--mute); background: var(--paper); border: 1px dashed var(--line); }
      .busy { opacity: 0.5; }

      .proposal {
        display: flex; align-items: center; gap: 10px;
        padding: 0 16px; background: var(--rail); color: var(--rail-mute); font-size: 12px;
      }
      .proposal a { color: #fff; }
      .proposal .on { color: #fff; font-weight: 700; }

      @media (max-width: 900px) {
        .body { grid-template-columns: 1fr; }
        .queues { display: flex; gap: 4px; overflow: auto; padding: 8px; }
        .q { white-space: nowrap; }
      }
    </style>
  </head>
  <body>
    <!--
      THESIS: 첫 화면은 대기열이다. 메뉴 트리보다 오늘 비울 큐가 앞선다.
      OWN-WORLD: 웜 차콜 레일, 티켓 행, 산화 오렌지 액션, 종이 작업면.
      STORY: 큐를 고르고 티켓을 묶어 상태를 민다.
      FIRST VIEWPORT: 상단 IA + 좌측 큐 카운트 + 티켓 더미.
      FORM: 포장대 디스패치. FINISH: 견본 — 방향 선택 전.
    -->
    <a class="skip" href="#main">본문으로</a>
    <div class="app">
      <header class="top">
        <div class="brand">E샵 작업대</div>
        <a href="#">상품</a>
        <a href="#">카테고리</a>
        <a href="#" aria-current="page">주문</a>
        <a href="#">정책</a>
        <a href="#">권한</a>
        <div class="who"><span>관리자</span><button type="button">로그아웃</button></div>
      </header>
      <div class="body">
        <nav class="queues" aria-label="처리 큐">
          <h2>오늘 큐</h2>
          <button class="q hot" type="button" data-q="WAIT" aria-current="true">신규 주문 <span class="n">3</span></button>
          <button class="q" type="button" data-q="PAYMENT">배송 준비 <span class="n">1</span></button>
          <button class="q" type="button" data-q="CANCEL">취소 요청 <span class="n">1</span></button>
          <button class="q" type="button" data-q="RETURN">반품 요청 <span class="n">0</span></button>
          <button class="q" type="button" data-q="CHANGE">교환 요청 <span class="n">0</span></button>
          <button class="q" type="button" data-q="COMPLETE">완료 <span class="n">1</span></button>
        </nav>
        <main class="work" id="main">
          <div class="work-head">
            <div>
              <h1 id="title">신규 주문 3</h1>
              <p>견본 가상 주문 · 시드 상품 기준</p>
            </div>
            <div class="spacer"></div>
            <input id="filter" class="field" type="search" placeholder="티켓 검색" aria-label="큐 검색" />
            <select id="next-status" class="field" aria-label="변경할 상태">
              <option value="PAYMENT">결제완료</option>
              <option value="COMPLETE">완료</option>
              <option value="CANCEL">취소</option>
            </select>
            <button class="btn btn-primary" type="button" id="apply" disabled>처리</button>
          </div>
          <div class="list" id="list"></div>
        </main>
      </div>
      <div class="proposal">
        <span class="on">B 큐 작업대</span>
        <a href="index.html">비교</a>
        <a href="01-dense-console.html">A</a>
        <a href="03-ledger-grid.html">C</a>
        <a href="04-inspector-split.html">D</a>
      </div>
    </div>
    <script>
      const DATA = [
        { id: "20250814-1001", q: "WAIT", time: "14:02", product: "오리지널 블렌드 원두 200g", option: "분쇄도 · 홀빈", price: "18,000", buyer: "김민준" },
        { id: "20250814-1002", q: "WAIT", time: "13:41", product: "디카페인 콜드브루 1L", option: "세트 · 단품", price: "12,000", buyer: "이서연" },
        { id: "20250814-1004", q: "WAIT", time: "12:55", product: "시그니처 머그 350ml", option: "옵션 없음", price: "15,000", buyer: "최하은" },
        { id: "20250814-1003", q: "PAYMENT", time: "13:18", product: "핸드드립 드리퍼 세트", option: "색상 · 블랙", price: "29,000", buyer: "박도윤" },
        { id: "20250814-1005", q: "CANCEL", time: "11:20", product: "오리지널 블렌드 원두 200g", option: "분쇄도 · 드립", price: "18,000", buyer: "정우진" },
        { id: "20250814-0998", q: "COMPLETE", time: "어제", product: "디카페인 콜드브루 1L", option: "세트 · 2병세트", price: "15,000", buyer: "한소희" },
      ];
      const TITLE = { WAIT: "신규 주문", PAYMENT: "배송 준비", CANCEL: "취소 요청", RETURN: "반품 요청", CHANGE: "교환 요청", COMPLETE: "완료" };
      let q = "WAIT";
      let selected = new Set();
      const list = document.getElementById("list");
      const apply = document.getElementById("apply");
      const filter = document.getElementById("filter");

      function counts() {
        document.querySelectorAll("[data-q]").forEach((btn) => {
          const n = DATA.filter((r) => r.q === btn.dataset.q).length;
          btn.querySelector(".n").textContent = n;
          btn.classList.toggle("hot", n > 0 && ["WAIT", "CANCEL", "RETURN", "CHANGE"].includes(btn.dataset.q));
        });
      }
      function visible() {
        const s = filter.value.trim();
        return DATA.filter((r) => r.q === q && (!s || `${r.id}${r.product}${r.buyer}`.includes(s)));
      }
      function render() {
        const rows = visible();
        document.getElementById("title").textContent = `${TITLE[q]} ${rows.length}`;
        if (!rows.length) {
          list.innerHTML = `<div class="empty">이 큐는 비었습니다. 다른 큐를 고르거나 검색을 지우세요.</div>`;
        } else {
          list.innerHTML = rows.map((r) => `
            <label class="ticket" aria-selected="${selected.has(r.id)}">
              <input type="checkbox" data-id="${r.id}" ${selected.has(r.id) ? "checked" : ""} />
              <div>
                <div class="id">${r.id}</div>
                <div class="meta">${r.time} · ${r.buyer} · ${r.product} · ${r.option}</div>
              </div>
              <div class="price">${r.price}원</div>
            </label>
          `).join("");
        }
        apply.disabled = selected.size === 0;
        counts();
      }
      document.querySelectorAll("[data-q]").forEach((btn) => {
        btn.addEventListener("click", () => {
          q = btn.dataset.q;
          selected.clear();
          document.querySelectorAll("[data-q]").forEach((b) => b.setAttribute("aria-current", String(b === btn)));
          render();
        });
      });
      list.addEventListener("change", (e) => {
        if (!e.target.dataset.id) return;
        if (e.target.checked) selected.add(e.target.dataset.id); else selected.delete(e.target.dataset.id);
        render();
      });
      filter.addEventListener("input", render);
      apply.addEventListener("click", () => {
        const next = document.getElementById("next-status").value;
        DATA.forEach((r) => { if (selected.has(r.id)) r.q = next; });
        selected.clear();
        render();
      });
      render();
    </script>
  </body>
</html>
