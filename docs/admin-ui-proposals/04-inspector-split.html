<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D. 검수 스플릿 — E샵 관리자</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
      :root {
        --nav: #111827;
        --nav-text: #e5e7eb;
        --nav-mute: #9ca3af;
        --ink: #111827;
        --mute: #4b5563;
        --line: #e5e7eb;
        --bg: #f3f4f6;
        --paper: #fff;
        --action: #1e3a5f;
        --wait: #9a3412;
        --ok: #166534;
        --side: 220px;
        --top: 52px;
        --bar: 40px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: Pretendard, "Noto Sans KR", sans-serif;
        background: var(--bg);
        color: var(--ink);
        font-size: 14px;
        line-height: 1.45;
      }
      ::selection { background: #d6e2f0; }
      :focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
      .skip {
        position: absolute; left: 8px; top: -48px; z-index: 80;
        background: #fff; color: var(--ink); padding: 8px 12px; font-weight: 650;
      }
      .skip:focus { top: 8px; }
      button, input, select { font: inherit; color: inherit; }
      a { color: inherit; text-decoration: none; }
      .icon { width: 18px; height: 18px; display: block; flex: none; }

      .app {
        display: grid;
        grid-template-columns: var(--side) 1fr;
        grid-template-rows: var(--top) 1fr var(--bar);
        min-height: 100%;
      }
      .top {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        padding: 0 20px;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
      }
      .brand { font-weight: 700; letter-spacing: -0.03em; }
      .top .who { margin-left: auto; display: flex; gap: 12px; align-items: center; font-size: 13px; color: var(--mute); }
      .top button { border: 0; background: none; cursor: pointer; color: var(--ink); }

      .nav {
        background: var(--nav);
        color: var(--nav-text);
        padding: 16px 10px;
      }
      .nav a {
        display: flex; align-items: center; gap: 10px;
        height: 36px; padding: 0 10px;
        color: var(--nav-mute); border-radius: 4px;
      }
      .nav a:hover { background: #1f2937; color: #fff; }
      .nav a[aria-current="page"] { background: #1f2937; color: #fff; font-weight: 650; }

      .split {
        display: grid;
        grid-template-columns: minmax(280px, 42%) 1fr;
        min-width: 0;
        min-height: 0;
      }
      .list-pane {
        border-right: 1px solid var(--line);
        background: var(--paper);
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .list-head {
        padding: 16px 16px 12px;
        border-bottom: 1px solid var(--line);
      }
      .list-head h1 { margin: 0 0 8px; font-size: 18px; letter-spacing: -0.03em; }
      .field {
        width: 100%; height: 34px; border: 1px solid var(--line); padding: 0 10px; background: #fff;
      }
      .orders { overflow: auto; flex: 1; }
      .order {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 12px;
        padding: 12px 16px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: #fff;
        text-align: left;
        cursor: pointer;
      }
      .order:hover { background: #f9fafb; }
      .order[aria-current="true"] { background: #e8eef5; }
      .order .id { font-weight: 700; font-variant-numeric: tabular-nums; }
      .order .meta { font-size: 12px; color: var(--mute); grid-column: 1 / -1; }
      .st { font-size: 12px; font-weight: 700; }
      .st-WAIT { color: var(--wait); }
      .st-PAYMENT { color: var(--action); }
      .st-COMPLETE { color: var(--ok); }
      .st-CANCEL { color: #9f1239; }
      .empty { padding: 32px 16px; color: var(--mute); font-size: 13px; }

      .inspect {
        overflow: auto;
        padding: 20px 24px 32px;
        background: var(--bg);
      }
      .panel {
        background: var(--paper);
        border: 1px solid var(--line);
        padding: 20px;
        max-width: 560px;
      }
      .panel h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -0.03em; }
      .panel .sub { margin: 0 0 20px; color: var(--mute); font-size: 13px; }
      .row { display: grid; grid-template-columns: 92px 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
      .row dt { color: var(--mute); }
      .row dd { margin: 0; }
      .items { margin: 0; padding: 0; list-style: none; }
      .items li { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
      .actions { display: flex; gap: 8px; margin-top: 20px; }
      .btn {
        height: 36px; padding: 0 14px; border: 1px solid var(--line); background: #fff; cursor: pointer;
      }
      .btn-primary { background: var(--action); border-color: var(--action); color: #fff; font-weight: 650; }
      .btn:disabled { color: #9ca3af; cursor: not-allowed; }

      .proposal {
        grid-column: 1 / -1;
        display: flex; align-items: center; gap: 10px;
        padding: 0 16px; background: var(--nav); color: var(--nav-mute); font-size: 12px;
      }
      .proposal a { color: #fff; }
      .proposal .on { color: #fff; font-weight: 700; }

      @media (max-width: 960px) {
        .app { grid-template-columns: 1fr; }
        .nav { display: none; }
        .split { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <!--
      THESIS: 주문은 목록과 검수가 한 화면이다. 상세 페이지 왕복을 거부한다.
      OWN-WORLD: 네이비 액션, 다크 사이드, 흰 리스트, 검수 패널.
      STORY: 행을 고르면 분쇄·세트 옵션과 상태를 오른쪽에서 확인한다.
      FIRST VIEWPORT: 좌측 메뉴 + 주문 리스트 + 검수 패널이 동시에 보인다.
      FORM: 마스터-디테일 검수대. FINISH: 견본 — 방향 선택 전.
    -->
    <a class="skip" href="#main">본문으로</a>
    <div class="app">
      <header class="top">
        <div class="brand">E샵 관리자</div>
        <div class="who"><span>관리자</span><button type="button">로그아웃</button></div>
      </header>
      <nav class="nav" aria-label="관리 메뉴">
        <a href="#">대시보드</a>
        <a href="#" aria-current="page">주문</a>
        <a href="#">배송</a>
        <a href="#">클레임</a>
        <a href="#">상품</a>
        <a href="#">카테고리</a>
        <a href="#">정책</a>
        <a href="#">권한</a>
        <a href="#">메뉴</a>
      </nav>
      <div class="split" id="main">
        <section class="list-pane" aria-label="주문 목록">
          <div class="list-head">
            <h1>주문</h1>
            <input id="filter" class="field" type="search" placeholder="주문번호 · 상품 · 주문자" aria-label="목록 검색" />
          </div>
          <div class="orders" id="orders"></div>
        </section>
        <section class="inspect" aria-live="polite">
          <div class="panel" id="panel"></div>
        </section>
      </div>
      <div class="proposal">
        <span class="on">D 검수 스플릿</span>
        <a href="index.html">비교</a>
        <a href="01-dense-console.html">A</a>
        <a href="02-queue-workbench.html">B</a>
        <a href="03-ledger-grid.html">C</a>
      </div>
    </div>
    <script>
      const DATA = [
        { id: "20250814-1001", time: "오늘 14:02", product: "오리지널 블렌드 원두 200g", option: "분쇄도 · 홀빈", qty: 1, price: "18,000", status: "WAIT", buyer: "김민준", phone: "010-0000-1001", addr: "서울 성동구 (견본)" },
        { id: "20250814-1002", time: "오늘 13:41", product: "디카페인 콜드브루 1L", option: "세트 · 단품", qty: 1, price: "12,000", status: "WAIT", buyer: "이서연", phone: "010-0000-1002", addr: "경기 성남시 (견본)" },
        { id: "20250814-1003", time: "오늘 13:18", product: "핸드드립 드리퍼 세트", option: "색상 · 블랙", qty: 1, price: "29,000", status: "PAYMENT", buyer: "박도윤", phone: "010-0000-1003", addr: "부산 해운대구 (견본)" },
        { id: "20250814-1004", time: "오늘 12:55", product: "시그니처 머그 350ml", option: "옵션 없음", qty: 2, price: "30,000", status: "WAIT", buyer: "최하은", phone: "010-0000-1004", addr: "대전 유성구 (견본)" },
        { id: "20250814-1005", time: "오늘 11:20", product: "오리지널 블렌드 원두 200g", option: "분쇄도 · 드립", qty: 1, price: "18,000", status: "CANCEL", buyer: "정우진", phone: "010-0000-1005", addr: "인천 연수구 (견본)" },
        { id: "20250814-0998", time: "어제 18:11", product: "디카페인 콜드브루 1L", option: "세트 · 2병세트", qty: 1, price: "15,000", status: "COMPLETE", buyer: "한소희", phone: "010-0000-0998", addr: "서울 마포구 (견본)" },
      ];
      const LABEL = { WAIT: "대기", PAYMENT: "결제완료", COMPLETE: "완료", CANCEL: "취소", RETURN: "반품", CHANGE: "교환" };
      let current = DATA[0].id;
      const ordersEl = document.getElementById("orders");
      const panel = document.getElementById("panel");
      const filter = document.getElementById("filter");

      function visible() {
        const q = filter.value.trim();
        return DATA.filter((r) => !q || `${r.id}${r.product}${r.buyer}`.includes(q));
      }
      function renderList() {
        const list = visible();
        if (!list.length) {
          ordersEl.innerHTML = `<div class="empty">검색에 맞는 주문이 없습니다. 검색어를 지워 전체 목록을 보세요.</div>`;
          return;
        }
        if (!list.some((r) => r.id === current)) current = list[0].id;
        ordersEl.innerHTML = list.map((r) => `
          <button class="order" type="button" data-id="${r.id}" ${r.id === current ? 'aria-current="true"' : ""}>
            <span class="id">${r.id}</span>
            <span class="st st-${r.status}">${LABEL[r.status]}</span>
            <span class="meta">${r.time} · ${r.buyer} · ${r.product}</span>
          </button>
        `).join("");
      }
      function renderPanel() {
        const r = DATA.find((x) => x.id === current);
        if (!r) {
          panel.innerHTML = `<p class="sub">왼쪽에서 주문을 고르세요.</p>`;
          return;
        }
        panel.innerHTML = `
          <h2>${r.id}</h2>
          <p class="sub">${r.time} · 견본 가상 주문</p>
          <dl>
            <div class="row"><dt>주문자</dt><dd>${r.buyer}</dd></div>
            <div class="row"><dt>연락처</dt><dd>${r.phone}</dd></div>
            <div class="row"><dt>배송지</dt><dd>${r.addr}</dd></div>
            <div class="row"><dt>상품</dt><dd>
              <ul class="items">
                <li><span>${r.product}<br />${r.option} × ${r.qty}</span><span>${r.price}원</span></li>
              </ul>
            </dd></div>
            <div class="row"><dt>상태</dt><dd>
              <select id="st" class="field" aria-label="주문 상태">
                ${Object.entries(LABEL).map(([k, v]) => `<option value="${k}" ${k === r.status ? "selected" : ""}>${v}</option>`).join("")}
              </select>
            </dd></div>
          </dl>
          <div class="actions">
            <button class="btn btn-primary" type="button" id="save">상태 저장</button>
            <button class="btn" type="button" id="next">다음 주문</button>
          </div>
        `;
        document.getElementById("save").addEventListener("click", () => {
          r.status = document.getElementById("st").value;
          renderList();
          renderPanel();
        });
        document.getElementById("next").addEventListener("click", () => {
          const list = visible();
          const i = list.findIndex((x) => x.id === current);
          current = list[(i + 1) % list.length].id;
          renderList();
          renderPanel();
        });
      }
      ordersEl.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-id]");
        if (!btn) return;
        current = btn.dataset.id;
        renderList();
        renderPanel();
      });
      filter.addEventListener("input", () => { renderList(); renderPanel(); });
      renderList();
      renderPanel();
    </script>
  </body>
</html>
